<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Prayer sermon slide background</title>
<desc id="desc">Original ministry-safe prayer background for Father&apos;s Business Bible Study. Prayer meetings and devotional slides.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#213b31"/>
    <stop offset="0.55" stop-color="#627b66"/>
    <stop offset="1" stop-color="#f0dfbd"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.11"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="#f8edd9" opacity="0.12"/>
<circle cx="845" cy="362" r="78" fill="#f7ecd8" opacity="0.86"/><path d="M690 725 C662 610 685 482 762 392 C814 460 838 552 825 710 Z" fill="#f6ead6" opacity="0.85"/><path d="M892 710 C878 552 902 460 954 392 C1032 482 1055 610 1026 725 Z" fill="#f6ead6" opacity="0.78"/><path d="M410 730 C595 640 1010 640 1190 730" stroke="#f6ead6" stroke-width="52" stroke-linecap="round" opacity="0.4"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.32"/>
</svg>
