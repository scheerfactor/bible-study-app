<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Teaching sermon slide background</title>
<desc id="desc">Original ministry-safe teaching background for Father&apos;s Business Bible Study. Teaching, classes, and lesson prep.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#213b31"/>
    <stop offset="0.55" stop-color="#627b66"/>
    <stop offset="1" stop-color="#f0dfbd"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.11"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="#f8edd9" opacity="0.12"/>
<rect x="310" y="210" width="980" height="520" rx="34" fill="#fbf2df" opacity="0.9"/><path d="M390 330 H1050 M390 420 H1180 M390 510 H940" stroke="#213a30" stroke-width="24" stroke-linecap="round" opacity="0.35"/><rect x="430" y="620" width="520" height="40" rx="20" fill="#213a30" opacity="0.22"/><path d="M1180 610 L1320 720" stroke="#fbf2df" stroke-width="34" stroke-linecap="round" opacity="0.62"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.32"/>
</svg>
