<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Shepherd sermon slide background</title>
<desc id="desc">Original ministry-safe shepherd background for Father&apos;s Business Bible Study. Pastoral care, Psalm passages, and guidance.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#213b31"/>
    <stop offset="0.55" stop-color="#627b66"/>
    <stop offset="1" stop-color="#f0dfbd"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
