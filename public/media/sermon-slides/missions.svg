<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Missions sermon slide background</title>
<desc id="desc">Original ministry-safe missions background for Father&apos;s Business Bible Study. Missions and worldwide evangelism.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#213b31"/>
    <stop offset="0.55" stop-color="#627b66"/>
    <stop offset="1" stop-color="#f0dfbd"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.11"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="#f8edd9" opacity="0.12"/>
<circle cx="800" cy="450" r="260" fill="none" stroke="#f4ead8" stroke-width="24" opacity="0.65"/><path d="M540 455 C660 390 740 425 805 365 C900 280 995 375 1062 338 M610 580 C720 530 820 610 940 548 C1038 498 1110 555 1192 520" fill="none" stroke="#f4ead8" stroke-width="36" stroke-linecap="round" opacity="0.72"/><path d="M800 190 C740 325 740 575 800 710 M800 190 C860 325 860 575 800 710 M540 450 L1060 450" stroke="#f4ead8" stroke-width="12" opacity="0.34"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.32"/>
</svg>
