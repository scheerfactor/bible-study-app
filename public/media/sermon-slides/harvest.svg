<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Harvest sermon slide background</title>
<desc id="desc">Original ministry-safe harvest background for Father&apos;s Business Bible Study. Harvest, sowing, missions, and service.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#213b31"/>
    <stop offset="0.55" stop-color="#627b66"/>
    <stop offset="1" stop-color="#f0dfbd"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.11"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="#f8edd9" opacity="0.12"/>
<circle cx="1230" cy="230" r="118" fill="#ffe29a" opacity="0.65"/><path d="M0 625 C285 580 420 635 685 570 C950 505 1140 570 1600 465 L1600 900 L0 900 Z" fill="#d6b36c" opacity="0.38"/><path d="M350 720 C445 560 530 482 650 390 M620 750 C690 585 790 505 920 405 M930 735 C1015 578 1120 500 1265 405" stroke="#fff1c6" stroke-width="20" stroke-linecap="round" opacity="0.72"/>
<rect width="1600" height="900" filter="url(#grain)" opacity="0.32"/>
</svg>
